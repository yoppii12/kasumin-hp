# media.kasumin.biz（オウンドメディア）配信設定（さくらVPS / nginx）
# 配置先: /etc/nginx/sites-available/media.conf（sites-enabledへシンボリックリンク）
#
# kasumin.conf（HP）と同じ構成。違いは server_name・証明書・root だけ
# 証明書: sudo certbot certonly --webroot -w /var/www/certbot -d media.kasumin.biz
# （DNS に media.kasumin.biz の A レコードを追加してから実行）

# HTTP: Let's Encrypt検証以外はすべてHTTPSへ
server {
    listen 80;
    listen [::]:80;
    server_name media.kasumin.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://media.kasumin.biz$request_uri;
    }
}

# 本体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.kasumin.biz;

    ssl_certificate     /etc/letsencrypt/live/media.kasumin.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.kasumin.biz/privkey.pem;

    root /var/www/media;
    index index.html;
    error_page 404 /404.html;

    # 末尾スラッシュを除去（/company/ → /company。トップは除く）
    rewrite ^/(.+)/$ /$1 permanent;

    # 圧縮転送（帯域削減）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # ファイル名にハッシュを含むアセットは1年キャッシュ（再訪問時のDLゼロ）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js静的出力: /articles/xxx → articles/xxx.html の解決
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
