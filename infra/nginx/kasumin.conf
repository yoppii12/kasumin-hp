# kasumin.biz 配信設定（さくらVPS / nginx）
# 配置先: /etc/nginx/sites-available/kasumin.conf（sites-enabledへシンボリックリンク）
#
# LAplust版（laplust.conf）との違い:
# - 新サイトは現行と同一URL構成のためリダイレクトmapは不要
# - www.kasumin.biz はDNSレコード自体が存在しないため、www用のserverブロックは持たない
#   （将来wwwを使う場合はDNSにレコード追加＋certbot -d www.kasumin.biz＋301ブロック追加）

# HTTP: Let's Encrypt検証以外はすべてHTTPSへ
server {
    listen 80;
    listen [::]:80;
    server_name kasumin.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://kasumin.biz$request_uri;
    }
}

# 本体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kasumin.biz;

    ssl_certificate     /etc/letsencrypt/live/kasumin.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasumin.biz/privkey.pem;

    root /var/www/kasumin;
    index index.html;
    error_page 404 /404.html;

    # 末尾スラッシュを除去（/company/ → /company。トップは除く）
    rewrite ^/(.+)/$ /$1 permanent;

    # 圧縮転送（帯域削減）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # ファイル名にハッシュを含むアセットは1年キャッシュ（再訪問時のDLゼロ）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js静的出力: /company → company.html の解決
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
