# kasumin.biz 配信設定（さくらVPS kasumin-hp / nginx）
# 配置先: /etc/nginx/sites-available/kasumin.conf（sites-enabledへシンボリックリンク）
#
# laplust-hp の laplust.conf を雛形に作成。kasumin.biz は現行と同一URL構成のため
# 旧URLリダイレクトマップは不要
# - http→https / www→apex の301
# - 末尾スラッシュの正規化（/company/ → /company）
# - /assets/ と /_next/static/ の1年immutableキャッシュ（ファイル名ハッシュ付き）
# - 404.html の配信
#
# ※DNS切替前は443ブロックが証明書未取得でエラーになるため、切替までは
#   このファイルの443の2ブロックをコメントアウトした暫定版を配置している。
#   certbot実行手順は docs/260921_フェーズ4インフラ構築記録.md を参照

# HTTP: Let's Encrypt検証以外はすべてHTTPSへ
server {
    listen 80;
    listen [::]:80;
    server_name kasumin.biz www.kasumin.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://kasumin.biz$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kasumin.biz;

    ssl_certificate     /etc/letsencrypt/live/kasumin.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasumin.biz/privkey.pem;

    return 301 https://kasumin.biz$request_uri;
}

# 本体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kasumin.biz;

    ssl_certificate     /etc/letsencrypt/live/kasumin.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasumin.biz/privkey.pem;

    root /var/www/kasumin;
    index index.html;
    error_page 404 /404.html;

    # 末尾スラッシュを除去（/company/ → /company。トップは除く）
    rewrite ^/(.+)/$ /$1 permanent;

    # 圧縮転送（帯域削減）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # ハッシュ付きファイル名のアセットは1年キャッシュ（再訪問時のDLゼロ）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js静的出力: /company → company.html の解決
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
