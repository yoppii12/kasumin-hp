# 長崎県で保育士に戻るときに使える支援の全体像 ／「どこから始めればいいか」
type: branch
title: どこから始めればいい？
question: いまの状況に近いものは？
cases:
  - if: 戻るかどうか、まだ決めていない
    then: カフェ・相談会で話を聞いてみる
    note: 同じように現場を離れている保育士さんや、センターの相談員と話せます
  - if: 働く園を探したい
    then: 保いっぷに求職登録して相談する
    note: 求人の情報を受け取りながら、見学や面接の日程を相談できます
  - if: 短い時間・単発から試したい
    then: えんまーるで募集を見てみる
    note: 午前のみ・単発・週1などの募集を見て、自分で応募できます
