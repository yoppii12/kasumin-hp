# 保育士の単発の仕事は派遣でもできる？ ／「日雇派遣は原則禁止」
type: branch
title: 派遣で単発の保育の仕事ができる？
question: 派遣会社と結ぶ雇用契約の期間は？
cases:
  - if: 31日以上（例：2か月の契約で、決まった曜日に働く）
    then: 日雇派遣にはあたらない
    note: 園で働く日数ではなく契約期間で判断。ただし、働く日が1日だけなどの形は認められない
  - if: 30日以内で、例外の人（60歳以上の人など）にあたる
    then: 単発の派遣で働ける
  - if: 30日以内で、例外の人にあたらない
    then: 原則としてできない
    note: 園と直接雇用契約を結ぶスポットワークなら、単発でも働ける
