# 子育て中に保育士に戻るとき ／「長崎市の申し込みと、入所の決まり方」
type: flow
title: 長崎市で保育所に申し込むまで
steps:
  - title: 空き状況を見る
    note: 長崎市の「イーカオ」に掲載（毎月20日ごろ更新）。空きがない施設にも申し込める
  - title: 勤務先に就労証明書を書いてもらう
    note: 国の標準様式。保育が必要かどうかの判定に使われる
  - title: 申し込む
    note: 保育利用申込書と教育・保育給付認定申請書。幼児課などで提出（郵送も可）
  - title: 入所が決まる
    note: 申し込みの順番ではなく、保育の必要性が高い方から。就労は勤務時間や日数で優先順位が決まる
