# 長崎で保育士のパートを探すときの時給の見方 ／「社会保険・扶養との関係」
type: flow
title: 時給から年収の目安を出す
steps:
  - title: 時給を確かめる
    note: 長崎県の最低賃金（1,087円）以上か
  - title: 1日の時間 × 週の日数
    note: 例：1日4時間 × 週5日 ＝ 週20時間
  - title: × 52週 で年収の目安
    note: 例：時給1,100円なら、約114万円（祝日・長期休みは考えない概算）
  - title: 扶養などの基準と比べる
    note: 所得税・住民税・社会保険の扶養は、それぞれ基準が別
