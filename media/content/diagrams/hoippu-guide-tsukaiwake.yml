# 保いっぷの使い方 ／「えんまーるとの使い分け」
type: cards
title: 保いっぷ・ハローワーク・えんまーるの使い分け
cards:
  - name: 保いっぷ
    tag: 長崎県の就職支援の窓口
    items:
      - スタッフに希望を伝え、見学や面接の日程を調整してもらう
      - 相談しながら、続けて働く園を探したい人に
  - name: ハローワーク
    tag: 国の就職支援の窓口（公共職業安定所）
    items:
      - 「支援センターの支援も希望する」と伝えると、保いっぷの支援も受けられる
      - ハローワーク長崎では、毎月第3火曜に保いっぷの巡回相談がある
  - name: えんまーる
    tag: 園の募集情報を掲載する情報提供プラットフォーム
    items:
      - 募集を自分で見て、自分で応募する
      - 午前のみ・単発・週1など、短い時間から試したい人に
