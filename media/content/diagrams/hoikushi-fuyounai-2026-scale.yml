# 保育士が扶養内で働くときの最新の計算（2026年）／「年収ごとに見る」
type: scale
title: 年収で見る「扶養」の境目（2026年）
axis: 本人の年収（給与収入）
marks:
  - value: 約106.5万円
    label: 住民税がかかり始める目安
    note: 自治体で違う。長崎市・単身・2026年度の例
  - value: 130万円
    label: 社会保険の扶養から外れる
    note: 配偶者の健康保険・年金の扶養。130万円未満なら入れる（労働契約の内容で判断）
    strong: true
  - value: 136万円
    label: 配偶者特別控除に変わる
    note: 配偶者控除から変わる（配偶者の税金の話）。急に大きく増えるわけではない
  - value: 178万円
    label: 本人に所得税がかかり始める
    note: 2026年分・2027年分の特例
  - value: 207万円
    label: 配偶者特別控除の対象外になる
