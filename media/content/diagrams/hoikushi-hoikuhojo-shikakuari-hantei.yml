# 資格はあるけれど保育補助で戻りたい ／「補助として入っても、保育士として数えられる？」
type: branch
title: 補助として入るときの扱い
question: 保育士登録をしている？
cases:
  - if: 登録していない（資格はある）
    then: 法律上は保育士ではない
    note: 補助として働くことはできる。「保育士」とは名乗れない
  - if: 登録していて、配置基準に数えられる立場で入る
    then: クラスの保育を担う1人として扱われる
    note: 職名が「補助」でも、法律上は保育士
  - if: 登録していて、配置基準に数えられない立場で入る
    then: 担任の保育士を支える役割が中心
    note: どちらの立場かは園が決める。働き始める前に確かめておく
