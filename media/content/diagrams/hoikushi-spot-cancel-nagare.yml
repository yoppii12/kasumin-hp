# 単発の仕事が園の都合でキャンセルされたら ／「労働契約はいつ成立するか」
type: flow
title: 応募してから、キャンセルされたときまで
steps:
  - title: 募集に応募する
    note: 面接がなく先着順で決まる募集で、特別な取り決めがなければ、応募した時点で契約が成立すると一般的には考えられる
  - title: 労働契約が成立する
    note: 労働基準法などの労働関係の法令が当てはまるようになる
  - title: 園の都合でキャンセル・早上がり
    note: 休業手当（平均賃金の60%以上）の対象。支払いは園の所定の賃金支払日まで
  - title: 支払われないとき
    note: まず園に支払いを求める。額が分からないときは労働基準監督署に相談
