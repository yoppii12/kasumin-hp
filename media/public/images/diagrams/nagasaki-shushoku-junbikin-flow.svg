<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 696" role="img" aria-labelledby="t">
<title id="t">長崎県の保育士就職準備金の申請の流れ：1 就職する、2 3か月以内に申請する、3 審査・送金、4 働きながら報告する、5 2年間続けて働くと全額免除</title>
<style>.h{font:700 26px var(--font-ja,sans-serif);fill:#333}.s{font:400 20px var(--font-body,sans-serif);fill:#666}.n{font:700 24px var(--font-body,sans-serif);fill:#333}</style>
<rect x="1" y="20" width="638" height="104" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="72.0" r="24" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/>
<text class="n" x="52" y="80.0" text-anchor="middle">1</text>
<text class="h" x="96" y="64">就職する</text>
<text class="s" x="96" y="98">県内の保育所等で、保育士として週20時間以上</text>
<path d="M52 130 V150" stroke="#AAAAAA" stroke-width="3"/>
<path d="M43 142 L52 152 L61 142" fill="none" stroke="#AAAAAA" stroke-width="3"/>
<rect x="1" y="158" width="638" height="104" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="210.0" r="24" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/>
<text class="n" x="52" y="218.0" text-anchor="middle">2</text>
<text class="h" x="96" y="202">3か月以内に申請する</text>
<text class="s" x="96" y="236">書類をそろえて、保いっぷ（支援センター）へ提出</text>
<path d="M52 268 V288" stroke="#AAAAAA" stroke-width="3"/>
<path d="M43 280 L52 290 L61 280" fill="none" stroke="#AAAAAA" stroke-width="3"/>
<rect x="1" y="296" width="638" height="104" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="348.0" r="24" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/>
<text class="n" x="52" y="356.0" text-anchor="middle">3</text>
<text class="h" x="96" y="340">審査・送金</text>
<text class="s" x="96" y="374">書類がそろってから約1か月。収入印紙代を引いて送金</text>
<path d="M52 406 V426" stroke="#AAAAAA" stroke-width="3"/>
<path d="M43 418 L52 428 L61 418" fill="none" stroke="#AAAAAA" stroke-width="3"/>
<rect x="1" y="434" width="638" height="104" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="486.0" r="24" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/>
<text class="n" x="52" y="494.0" text-anchor="middle">4</text>
<text class="h" x="96" y="478">働きながら報告する</text>
<text class="s" x="96" y="512">働いている間は返還が猶予される</text>
<path d="M52 544 V564" stroke="#AAAAAA" stroke-width="3"/>
<path d="M43 556 L52 566 L61 556" fill="none" stroke="#AAAAAA" stroke-width="3"/>
<rect x="1" y="572" width="638" height="104" rx="14" fill="#F9F9F9" stroke="#F4A7B9" stroke-width="3"/>
<circle cx="52" cy="624.0" r="24" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/>
<text class="n" x="52" y="632.0" text-anchor="middle">5</text>
<text class="h" x="96" y="616">2年間続けて働く</text>
<text class="s" x="96" y="650">借りたお金は全額免除</text>
</svg>
