<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" role="img" aria-labelledby="nagasaki-hoikushi-part-jikyu-nenshu-t">
<title id="nagasaki-hoikushi-part-jikyu-nenshu-t">時給から年収の目安を出す／1 時給を確かめる（長崎県の最低賃金（1,087円）以上か）／2 1日の時間 × 週の日数（例：1日4時間 × 週5日 ＝ 週20時間）／3 × 52週 で年収の目安（例：時給1,100円なら、約114万円（祝日・長期休みは考えない概算））／4 扶養などの基準と比べる（所得税・住民税・社会保険の扶養は、それぞれ基準が別）</title>
<style>.h{font:700 26px var(--font-ja,sans-serif);fill:#333}.b{font:400 22px var(--font-body,sans-serif);fill:#333}.bb{font:700 24px var(--font-body,sans-serif);fill:#333}.s{font:400 20px var(--font-body,sans-serif);fill:#666}.n{font:700 22px var(--font-body,sans-serif);fill:#333}.t{font:700 28px var(--font-ja,sans-serif);fill:#333}</style>
<text class="t" x="0" y="30">時給から年収の目安を出す</text>
<rect x="1" y="52" width="638" height="116" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="110" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="118" text-anchor="middle">1</text>
<text class="h" x="96" y="96">時給を確かめる</text>
<text class="s" x="96" y="134">長崎県の最低賃金（1,087円）以上か</text>
<path d="M52 172 V196" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M43 192 L52 204 L61 192" stroke="#AAAAAA" stroke-width="3" fill="none"/>
<rect x="1" y="208" width="638" height="116" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="266" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="274" text-anchor="middle">2</text>
<text class="h" x="96" y="252">1日の時間 × 週の日数</text>
<text class="s" x="96" y="290">例：1日4時間 × 週5日 ＝ 週20時間</text>
<path d="M52 328 V352" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M43 348 L52 360 L61 348" stroke="#AAAAAA" stroke-width="3" fill="none"/>
<rect x="1" y="364" width="638" height="144" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="436" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="444" text-anchor="middle">3</text>
<text class="h" x="96" y="408">× 52週 で年収の目安</text>
<text class="s" x="96" y="446">例：時給1,100円なら、約114万円（祝日・長期休みは考</text><text class="s" x="96" y="474">えない概算）</text>
<path d="M52 512 V536" stroke="#AAAAAA" stroke-width="3" fill="none"/><path d="M43 532 L52 544 L61 532" stroke="#AAAAAA" stroke-width="3" fill="none"/>
<rect x="1" y="548" width="638" height="116" rx="14" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="606" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="614" text-anchor="middle">4</text>
<text class="h" x="96" y="592">扶養などの基準と比べる</text>
<text class="s" x="96" y="630">所得税・住民税・社会保険の扶養は、それぞれ基準が別</text>
</svg>
