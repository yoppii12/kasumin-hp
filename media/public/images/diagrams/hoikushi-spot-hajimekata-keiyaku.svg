<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 694" role="img" aria-labelledby="hoikushi-spot-hajimekata-keiyaku-t">
<title id="hoikushi-spot-hajimekata-keiyaku-t">単発で働く形と、雇い主／直接雇用（スポットワーク）：保育士と園（雇用契約）。アプリやサイトを通して応募しても、雇い主は園です。単発（30日以内）でも働けます／派遣：保育士と派遣会社（雇用契約）、派遣会社と園（派遣の契約）、保育士と園（園で働く）。雇い主は派遣会社。雇用期間30日以内の派遣（日雇派遣）は原則禁止で、60歳以上の方などは例外です</title>
<style>.h{font:700 26px var(--font-ja,sans-serif);fill:#333}.b{font:400 22px var(--font-body,sans-serif);fill:#333}.bb{font:700 24px var(--font-body,sans-serif);fill:#333}.s{font:400 20px var(--font-body,sans-serif);fill:#666}.n{font:700 22px var(--font-body,sans-serif);fill:#333}.t{font:700 28px var(--font-ja,sans-serif);fill:#333}</style>
