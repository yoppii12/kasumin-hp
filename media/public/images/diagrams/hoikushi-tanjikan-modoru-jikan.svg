<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" role="img" aria-labelledby="hoikushi-tanjikan-modoru-jikan-t">
<title id="hoikushi-tanjikan-modoru-jikan-t">働き方と年収の目安（時給1,100円の場合）／週に働く時間／週8時間 1日4時間 × 週2日（年収の目安 約46万円）／週16時間 1日4時間 × 週4日（年収の目安 約92万円）／週20時間 1日4時間 × 週5日（年収の目安 約114万円。週20時間以上は、勤務先の規模などの条件を満たすと社会保険の対象）／週25時間 1日5時間 × 週5日（年収の目安 約143万円（130万円を超える））</title>
<style>.h{font:700 26px var(--font-ja,sans-serif);fill:#333}.b{font:400 22px var(--font-body,sans-serif);fill:#333}.bb{font:700 24px var(--font-body,sans-serif);fill:#333}.s{font:400 20px var(--font-body,sans-serif);fill:#666}.n{font:700 22px var(--font-body,sans-serif);fill:#333}.t{font:700 28px var(--font-ja,sans-serif);fill:#333}</style>
