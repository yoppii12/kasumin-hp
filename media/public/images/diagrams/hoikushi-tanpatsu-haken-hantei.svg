<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" aria-labelledby="hoikushi-tanpatsu-haken-hantei-t">
<title id="hoikushi-tanpatsu-haken-hantei-t">派遣で単発の保育の仕事ができる？／派遣会社と結ぶ雇用契約の期間は？／1 31日以上（例：2か月の契約で、決まった曜日に働く）→日雇派遣にはあたらない（園で働く日数ではなく契約期間で判断。ただし、働く日が1日だけなどの形は認められない）／2 30日以内で、例外の人（60歳以上の人など）にあたる→単発の派遣で働ける／3 30日以内で、例外の人にあたらない→原則としてできない（園と直接雇用契約を結ぶスポットワークなら、単発でも働ける）</title>
<style>.h{font:700 26px var(--font-ja,sans-serif);fill:#333}.b{font:400 22px var(--font-body,sans-serif);fill:#333}.bb{font:700 24px var(--font-body,sans-serif);fill:#333}.s{font:400 20px var(--font-body,sans-serif);fill:#666}.n{font:700 22px var(--font-body,sans-serif);fill:#333}.t{font:700 28px var(--font-ja,sans-serif);fill:#333}</style>
<text class="t" x="0" y="30">派遣で単発の保育の仕事ができる？</text>
<rect x="1" y="52" width="638" height="66" rx="30" fill="#F9F9F9" stroke="#E5E5E5" stroke-width="1.5"/>
<text class="bb" x="320" y="92" text-anchor="middle">派遣会社と結ぶ雇用契約の期間は？</text>
<rect x="1" y="134" width="638" height="172" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="220" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="228" text-anchor="middle">1</text>
<text class="s" x="96" y="176">31日以上（例：2か月の契約で、決まった曜日に働く）</text>
<text class="bb" x="96" y="212">→ 日雇派遣にはあたらない</text>
<text class="s" x="96" y="250">園で働く日数ではなく契約期間で判断。ただし、働く日が</text><text class="s" x="96" y="278">1日だけなどの形は認められない</text>
<rect x="1" y="318" width="638" height="110" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="373" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="381" text-anchor="middle">2</text>
<text class="s" x="96" y="360">30日以内で、例外の人（60歳以上の人など）にあたる</text>
<text class="bb" x="96" y="396">→ 単発の派遣で働ける</text>
<rect x="1" y="440" width="638" height="172" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
<circle cx="52" cy="526" r="22" fill="#FFFFFF" stroke="#F4A7B9" stroke-width="2"/><text class="n" x="52" y="534" text-anchor="middle">3</text>
<text class="s" x="96" y="482">30日以内で、例外の人にあたらない</text>
<text class="bb" x="96" y="518">→ 原則としてできない</text>
<text class="s" x="96" y="556">園と直接雇用契約を結ぶスポットワークなら、単発でも働</text><text class="s" x="96" y="584">ける</text>
</svg>
